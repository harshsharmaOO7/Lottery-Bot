# .github/workflows/main.yml  ← lowercase .github REQUIRED
# ═══════════════════════════════════════════════════════════
#  ROOT CAUSE FIX:
#  Old workflow: cron chalta tha → bot.py bina --draw ke → 
#    auto_draw() IST time se detect karta → WRONG draw milta
#    1PM cron (07:35 UTC = 13:05 IST) → auto_draw = "6PM" ❌
#    6PM cron (12:35 UTC = 18:05 IST) → auto_draw = "8PM" ❌
#    8PM cron (14:40 UTC = 20:10 IST) → auto_draw = "8PM" ✅
#  Fix: Har cron explicitly --draw pass karta hai
# ═══════════════════════════════════════════════════════════

name: Lottery Bot

on:
  schedule:
    - cron: "35 7  * * *"   # 1PM IST draw  (07:35 UTC = 13:05 IST)
    - cron: "35 12 * * *"   # 6PM IST draw  (12:35 UTC = 18:05 IST)
    - cron: "40 14 * * *"   # 8PM IST draw  (14:40 UTC = 20:10 IST)

  workflow_dispatch:
    inputs:
      draw:
        description: "Draw: 1PM / 6PM / 8PM / all"
        required: true
        default: "all"
        type: choice
        options: [all, 1PM, 6PM, 8PM]
      date:
        description: "Date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
      seed:
        description: "Run seed_old.py first? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  fetch-results:
    name: Fetch Lottery Results
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml -q

      # ── Seed historical data (optional, only when seed=yes) ──
      - name: Seed historical data (if requested)
        if: github.event.inputs.seed == 'yes'
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          echo "Running seed_old.py..."
          python seed_old.py

      # ── KEY FIX: explicitly pass --draw based on cron hour ──
      - name: Detect draw from cron schedule
        id: which_draw
        run: |
          H=$(date -u +"%H")
          # Cron runs at specific UTC hours → map to exact draw
          if   [ "$H" = "07" ]; then echo "draw=1PM" >> $GITHUB_OUTPUT
          elif [ "$H" = "12" ]; then echo "draw=6PM" >> $GITHUB_OUTPUT
          elif [ "$H" = "14" ]; then echo "draw=8PM" >> $GITHUB_OUTPUT
          else
            # Manual trigger — use input value
            echo "draw=${{ github.event.inputs.draw }}" >> $GITHUB_OUTPUT
          fi
          echo "Detected hour: $H UTC → draw: $(cat $GITHUB_OUTPUT | grep draw | cut -d= -f2)"

      - name: Run bot.py with explicit draw
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          DRAW="${{ steps.which_draw.outputs.draw }}"
          DATE="${{ github.event.inputs.date }}"
          
          ARGS="--draw $DRAW"
          [ -n "$DATE" ] && ARGS="$ARGS --date $DATE"
          
          echo "▶ python bot.py $ARGS"
          python bot.py $ARGS

      - name: Commit results
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"
          git add results.json images/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            IST=$(python3 -c "import datetime; ist=datetime.datetime.utcnow()+datetime.timedelta(hours=5,minutes=30); print(ist.strftime('%d %b %Y %I:%M %p IST'))")
            git commit -m "🎯 Result updated — $IST"
            git push
            echo "✅ Pushed"
          fi

      - name: Summary
        if: always()
        run: |
          [ -f results.json ] && python3 -c "
          import json, datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5,minutes=30)
          d   = json.load(open('results.json'))
          print(f'IST: {ist:%Y-%m-%d %H:%M} | Total: {d.get(\"total_records\",0)}')
          for r in d.get('nagaland',[])[:6]:
              print(f'  {\"✅\" if r.get(\"image\") else \"❌\"} {r[\"date\"]} {r[\"draw\"]:3} | {r[\"draw_name\"]}')
          "
