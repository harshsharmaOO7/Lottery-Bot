# .github/workflows/main.yml
# ═══════════════════════════════════════════════════════════
#  Lottery Bot — GitHub Actions Workflow
#  ───────────────────────────────────────────────────────────
#  TWO jobs:
#    seed  — Run ONCE manually to load historical 90 records
#    daily — Runs 3x daily at IST draw times automatically
#
#  Cron schedule (IST → UTC):
#    1PM IST  = 07:35 UTC
#    6PM IST  = 12:35 UTC
#    8PM IST  = 14:40 UTC
# ═══════════════════════════════════════════════════════════

name: Lottery Bot

on:
  schedule:
    - cron: "35 7  * * *"    # 1:05 PM IST  — after 1PM result
    - cron: "35 12 * * *"    # 6:05 PM IST  — after 6PM result
    - cron: "40 14 * * *"    # 8:10 PM IST  — after 8PM result

  workflow_dispatch:
    inputs:
      job:
        description: "Which job: daily / seed"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - seed
      draw:
        description: "Draw (daily only): 1PM / 6PM / 8PM / all"
        required: false
        default: "all"
      date:
        description: "Date override (daily only): YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

# ── ONE-TIME SEED JOB ──────────────────────────────────────────────
jobs:
  seed:
    name: Seed Historical Data (run once)
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.job == 'seed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml -q

      - name: Run seed_old.py
        env:
          PYTHONUNBUFFERED: "1"
        run: python seed_old.py

      - name: Commit results.json
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "No changes — already seeded"
          else
            IST_TIME=$(python3 -c "
          import datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          print(ist.strftime('%d %b %Y %I:%M %p IST'))
          ")
            git commit -m "🌱 Seed: historical results loaded — ${IST_TIME}"
            git push
            echo "✅ Seed complete and pushed"
          fi

  # ── DAILY SCRAPER JOB ────────────────────────────────────────────
  daily:
    name: Fetch Today's Results
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 -q

      - name: Determine draw from cron time
        id: draw
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" = "07" ]; then
            echo "draw=1PM" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "12" ]; then
            echo "draw=6PM" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "14" ]; then
            echo "draw=8PM" >> $GITHUB_OUTPUT
          else
            echo "draw=" >> $GITHUB_OUTPUT
          fi

      - name: Run bot.py
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Manual override takes priority
          MANUAL_DRAW="${{ github.event.inputs.draw }}"
          MANUAL_DATE="${{ github.event.inputs.date }}"
          CRON_DRAW="${{ steps.draw.outputs.draw }}"

          ARGS=""

          if [ -n "$MANUAL_DRAW" ] && [ "$MANUAL_DRAW" != "" ]; then
            ARGS="--draw $MANUAL_DRAW"
          elif [ -n "$CRON_DRAW" ]; then
            ARGS="--draw $CRON_DRAW"
          fi

          if [ -n "$MANUAL_DATE" ] && [ "$MANUAL_DATE" != "" ]; then
            ARGS="$ARGS --date $MANUAL_DATE"
          fi

          echo "Running: python bot.py $ARGS"
          python bot.py $ARGS

      - name: Commit results.json if changed
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "No changes — result already current"
          else
            IST_TIME=$(python3 -c "
          import datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          print(ist.strftime('%d %b %Y %I:%M %p IST'))
          ")
            git commit -m "🎯 Auto: result updated — ${IST_TIME}"
            git push
            echo "✅ Pushed to repo"
          fi

      - name: Summary
        if: always()
        run: |
          echo "===== BOT SUMMARY ====="
          if [ -f results.json ]; then
            python3 -c "
          import json, datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5,minutes=30)
          with open('results.json') as f:
              d = json.load(f)
          print(f'IST time     : {ist.strftime(\"%Y-%m-%d %H:%M\")}')
          print(f'Last updated : {d.get(\"last_updated\", \"N/A\")}')
          print(f'Total records: {d.get(\"total_records\", 0)}')
          for r in d.get('nagaland',[])[:6]:
              img = '✅' if r.get('image') else '❌'
              pdf = '📄' if r.get('pdf') else '  '
              seed = ' [seed]' if r.get('seeded') else ''
              print(f'{img}{pdf} {r[\"date\"]} {r[\"draw\"]:3} | {r[\"draw_name\"]}{seed}')
          "
          fi
          echo "======================="
