# .github/workflows/main.yml  ← lowercase .github REQUIRED
name: Lottery Bot

on:
  schedule:
    - cron: "25 7  * * *"   # 1PM draw — 12:55 PM IST
    - cron: "25 12 * * *"   # 6PM draw —  5:55 PM IST
    - cron: "25 14 * * *"   # 8PM draw —  7:55 PM IST

  workflow_dispatch:
    inputs:
      draw:
        description: "Draw: 1PM / 6PM / 8PM / all"
        required: true
        default: "all"
        type: choice
        options: [all, 1PM, 6PM, 8PM]
      date:
        description: "Date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
      seed:
        description: "Seed 3-month history first? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  fetch-results:
    name: Fetch Lottery Results
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml -q

      - name: Seed historical data
        if: github.event.inputs.seed == 'yes'
        env: { PYTHONUNBUFFERED: "1" }
        run: python seed_old.py

      # ── KEY FIX: cron hour se draw detect karo ──────────────
      - name: Detect draw
        id: which_draw
        run: |
          H=$(date -u +"%H")
          # Cron-based detection (scheduled runs)
          if   [ "$H" = "07" ]; then DRAW="1PM"
          elif [ "$H" = "12" ]; then DRAW="6PM"
          elif [ "$H" = "14" ]; then DRAW="8PM"
          else
            # Manual trigger — use input (guaranteed non-empty because required=true)
            DRAW="${{ github.event.inputs.draw }}"
          fi
          echo "draw=$DRAW" >> $GITHUB_OUTPUT
          echo "Detected: hour=$H UTC → draw=$DRAW"

      # ── Run bot ──────────────────────────────────────────────
      - name: Run bot.py
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          DRAW="${{ steps.which_draw.outputs.draw }}"
          DATE="${{ github.event.inputs.date }}"

          echo "Draw=$DRAW | Date=${DATE:-today}"

          if [ -n "$DATE" ]; then
            python bot.py --draw "$DRAW" --date "$DATE" --no-window
          elif [ "$DRAW" = "all" ]; then
            python bot.py --draw all --no-window
          else
            python bot.py --draw "$DRAW"
          fi

      - name: Commit results
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"
          git add results.json images/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            IST=$(python3 -c "
          import datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5,minutes=30)
          print(ist.strftime('%d %b %Y %I:%M %p IST'))
          ")
            git commit -m "🎯 Result updated — $IST"
            git push
            echo "✅ Pushed"
          fi

      - name: Summary
        if: always()
        run: |
          python3 -c "
          import json, datetime, os
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5,minutes=30)
          if not os.path.exists('results.json'):
              print('results.json missing'); exit()
          d = json.load(open('results.json'))
          print(f'IST: {ist:%Y-%m-%d %H:%M} | Total: {d.get(\"total_records\",0)}')
          for r in d.get('nagaland',[])[:6]:
              print(f'  {\"✅\" if r.get(\"image\") else \"❌\"} {r[\"date\"]} {r[\"draw\"]:3} | {r[\"draw_name\"]}')
          " || echo "Summary skipped"
