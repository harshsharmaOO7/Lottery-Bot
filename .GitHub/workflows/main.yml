# ═══════════════════════════════════════════════════════════
#  Lottery Bot — GitHub Actions Workflow (Fixed)
#  ───────────────────────────────────────────────────────────
#  Cron schedule (IST → UTC conversion):
#    1PM IST  = 07:35 UTC
#    6PM IST  = 12:35 UTC
#    8PM IST  = 14:40 UTC
#
#  IMPORTANT: Agar koi draw miss ho gaya, workflow_dispatch
#  se manually bhi chala sakte ho GitHub UI se.
# ═══════════════════════════════════════════════════════════

name: Lottery Bot

on:
  schedule:
    - cron: "35 7  * * *"    # 1:05 PM IST (after 1PM result)
    - cron: "35 12 * * *"    # 6:05 PM IST (after 6PM result)
    - cron: "40 14 * * *"    # 8:10 PM IST (after 8PM result)

  # Manual trigger — GitHub Actions UI se chala sako
  workflow_dispatch:
    inputs:
      draw:
        description: "Draw: 1PM / 6PM / 8PM / all"
        required: false
        default: "all"
      date:
        description: "Date: YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""

permissions:
  contents: write   # results.json commit karne ke liye

jobs:
  fetch-results:
    name: Fetch Lottery Results
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Zyada time laga toh fail karo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ──────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────
      - name: Install dependencies
        run: pip install requests beautifulsoup4 -q

      # ── 4. Run bot ───────────────────────────────────────────
      - name: Run lottery bot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Build arguments
          ARGS=""

          if [[ "${{ github.event.inputs.draw }}" != "" ]]; then
            ARGS="--draw ${{ github.event.inputs.draw }}"
          fi

          if [[ "${{ github.event.inputs.date }}" != "" ]]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi

          echo "Running: python bot.py $ARGS"
          python bot.py $ARGS

      # ── 5. Commit results ────────────────────────────────────
      - name: Commit and push results
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"

          git add results.json

          if git diff --cached --quiet; then
            echo "No changes to commit — results already current"
          else
            # IST timestamp in commit message
            IST_TIME=$(python3 -c "
          import datetime
          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          print(ist.strftime('%d %b %Y %I:%M %p IST'))
          ")
            git commit -m "🎯 Lottery result updated — ${IST_TIME}"
            git push
            echo "✅ Pushed to repo"
          fi

      # ── 6. Summary ───────────────────────────────────────────
      - name: Show summary
        if: always()
        run: |
          echo "===== BOT SUMMARY ====="
          if [ -f results.json ]; then
            python3 -c "
          import json, datetime

          def ist():
              return datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)

          with open('results.json') as f:
              d = json.load(f)

          print(f'IST time     : {ist().strftime(\"%Y-%m-%d %H:%M\")}')
          print(f'Last updated : {d.get(\"last_updated\", \"N/A\")}')
          print(f'Total records: {d.get(\"total_records\", 0)}')

          for r in d.get('nagaland', [])[:3]:
              img = r.get('image','')
              has_img = '✅' if img else '❌'
              print(f'{has_img} {r[\"date\"]} {r[\"draw\"]:3s} | {r[\"draw_name\"]}')
          "
          else
            echo "results.json not found!"
          fi
          echo "======================="
