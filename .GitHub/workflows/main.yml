# ═══════════════════════════════════════════════════════
#  Lottery Bot v3 — GitHub Actions Workflow
#  ─────────────────────────────────────────────────────
#  Schedule (IST draw times → UTC):
#    1:05 PM IST = 07:35 UTC
#    6:05 PM IST = 12:35 UTC
#    8:10 PM IST = 14:40 UTC
#
#  Also commits: sitemap.xml, pdfs/, images/
# ═══════════════════════════════════════════════════════

name: Lottery Bot v3

on:
  schedule:
    - cron: "35 7  * * *"   # 1:05 PM IST
    - cron: "35 12 * * *"   # 6:05 PM IST
    - cron: "40 14 * * *"   # 8:10 PM IST

  workflow_dispatch:
    inputs:
      draw:
        description: "Draw time (1PM / 6PM / 8PM)"
        required: false
        default: ""
      state:
        description: "State (nagaland / kerala / all)"
        required: false
        default: "all"
      date:
        description: "Date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
      skip_image:
        description: "Skip image scraping (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  lottery-bot:
    name: Fetch Lottery Results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poppler (PDF→Image)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
        continue-on-error: true

      - name: Install Python packages
        run: pip install -r requirements.txt -q

      - name: Create output directories
        run: |
          mkdir -p pdfs images
          touch pdfs/.gitkeep images/.gitkeep

      - name: Run Lottery Bot
        env:
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Kolkata"
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.draw }}" ]        && ARGS="$ARGS --draw ${{ github.event.inputs.draw }}"
          [ -n "${{ github.event.inputs.state }}" ]       && ARGS="$ARGS --state ${{ github.event.inputs.state }}"
          [ -n "${{ github.event.inputs.date }}" ]        && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.skip_image }}" = "true" ] && ARGS="$ARGS --skip-image"
          echo "▶ Running: python bot.py $ARGS"
          python bot.py $ARGS

      - name: Commit results
        run: |
          git config user.name  "Lottery Bot"
          git config user.email "bot@noreply.github.com"

          # Stage all changed files
          git add results.json sitemap.xml || true
          git add pdfs/   || true
          git add images/ || true

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            DATE=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
            git commit -m "🎯 Lottery results — ${DATE}"
            git push
            echo "✅ Pushed successfully"
          fi

      - name: Summary
        if: always()
        run: |
          echo "=== Run Summary ==="
          echo "Time   : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"
          echo "Trigger: ${{ github.event_name }}"
          [ -f results.json ] && python3 -c "
          import json
          d = json.load(open('results.json'))
          print('Records:', d.get('total_records','?'))
          print('Updated:', d.get('last_updated','?'))
          n = d.get('nagaland', [])
          if n: print('Latest Nagaland:', n[0]['date'], n[0]['draw'])
          "
          echo "==================="
